# Artisan Gem Works - Project 4: hardened Nginx
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=adm:10m  rate=5r/m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;

  upstream app { server app:3000; }

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options           "DENY"                                                  always;
    add_header X-Content-Type-Options    "nosniff"                                               always;
    add_header X-XSS-Protection          "1; mode=block"                                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                      always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"         always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://js.stripe.com https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com; img-src 'self' data: https:; object-src 'none'; base-uri 'self';" always;

    location ~* \.(woff2?|ttf|otf)$ { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=31536000, immutable"; expires 365d; }
    location ~* \.(css|js)$          { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=604800"; expires 7d; }
    location ~* \.(png|jpg|svg|ico)$ { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=86400"; expires 1d; }
    location ~* \.html$              { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate"; }

    location /api/auth/ {
      limit_req zone=auth burst=2 nodelay; limit_req_status 429;
      proxy_pass http://app;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/admin/ {
      limit_req zone=adm burst=3 nodelay; limit_req_status 429;
      proxy_pass http://app;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
      limit_req zone=api burst=20 nodelay; limit_req_status 429;
      proxy_pass http://app;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health { proxy_pass http://app; proxy_set_header Host $host; access_log off; }
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri.html $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
  }
}
