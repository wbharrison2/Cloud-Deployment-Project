<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Artisan Gem Works</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="location-banner">
    <div class="container">
      <span>Location:</span>
      <button class="loc-btn" onclick="setLocation('pdx')" id="loc-pdx">Portland</button>
      <button class="loc-btn" onclick="setLocation('sea')" id="loc-sea">Seattle</button>
    </div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">Artisan Gem Works</a>
      <nav class="main-nav"><a href="/shop.html" class="active">Shop</a><a href="/#locations">Locations</a></nav>
      <div class="header-actions">
        <span class="location-badge" id="header-location"></span>
        <a href="/account.html" class="btn-icon">Account</a>
        <a href="/cart.html" class="btn-icon cart-link">Cart (<span id="cart-count">0</span>)</a>
      </div>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <div class="page-header">
        <h1>The Collection</h1>
        <p id="shop-location-desc">Showing all products</p>
      </div>
      <div class="shop-toolbar">
        <input type="search" id="search-input" class="search-input" placeholder="Search jewelry...">
        <div class="category-filters" id="category-filters"></div>
        <select id="sort-select" class="sort-select">
          <option value="name">Name A–Z</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
        </select>
      </div>
      <div id="cache-indicator" class="cache-indicator hidden"></div>
      <div class="product-grid" id="product-grid"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner"><p>&copy; 2024 Artisan Gem Works</p></div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/shop.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      updateCartCount();
      const loc = getLocation();
      document.getElementById('loc-' + loc).classList.add('active');
      document.getElementById('header-location').textContent = loc === 'sea' ? 'Seattle' : 'Portland';
      document.getElementById('shop-location-desc').textContent =
        'Showing ' + (loc === 'sea' ? 'Seattle' : 'Portland') + ' collection (shared + local exclusives)';
      initShop();
    });
  </script>
</body>
</html>
