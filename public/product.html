<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Artisan Gem Works</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">Artisan Gem Works</a>
      <nav class="main-nav"><a href="/shop.html">Shop</a><a href="/#locations">Locations</a></nav>
      <div class="header-actions">
        <a href="/account.html" class="btn-icon">Account</a>
        <a href="/cart.html" class="btn-icon cart-link">Cart (<span id="cart-count">0</span>)</a>
      </div>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <nav class="breadcrumb"><a href="/">Home</a> &rsaquo; <a href="/shop.html">Shop</a> &rsaquo; <span id="product-breadcrumb">Product</span></nav>
      <div id="product-loading" class="loading-state">Loading product...</div>
      <div id="product-error" class="error-state hidden">Product not found.</div>
      <div id="product-detail" class="product-detail hidden">
        <div class="product-gallery">
          <div class="product-image-main"><div class="img-placeholder" id="product-img-placeholder">Jewelry</div></div>
        </div>
        <div class="product-info">
          <span class="product-category" id="product-category"></span>
          <h1 id="product-name"></h1>
          <p class="product-price" id="product-price"></p>
          <div id="product-location-badge" class="product-location-badge hidden"></div>
          <p class="product-description" id="product-description"></p>
          <div class="product-meta">
            <span id="product-material"></span>
            <span id="product-stock"></span>
          </div>
          <div class="product-actions">
            <div class="quantity-selector">
              <button class="qty-btn" onclick="changeQty(-1)">−</button>
              <input type="number" id="quantity" value="1" min="1" max="10">
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <button class="btn btn-primary" id="add-to-cart-btn" onclick="addToCartFromPage()">Add to Cart</button>
          </div>
          <div id="add-to-cart-feedback" class="feedback hidden"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="container footer-inner"><p>&copy; 2024 Artisan Gem Works</p></div></footer>

  <script src="/js/app.js"></script>
  <script src="/js/shop.js"></script>
  <script>
    let currentProduct = null;
    document.addEventListener('DOMContentLoaded', () => { updateCartCount(); loadProduct(); });

    async function loadProduct() {
      const slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) { showError(); return; }
      try {
        currentProduct = await fetchAPI('/api/products/' + slug);
        renderProduct(currentProduct);
      } catch(e) { showError(); }
    }

    function renderProduct(p) {
      document.title = p.name + ' — Artisan Gem Works';
      document.getElementById('product-breadcrumb').textContent = p.name;
      document.getElementById('product-name').textContent = p.name;
      document.getElementById('product-category').textContent = p.category;
      document.getElementById('product-price').textContent = formatPrice(p.price);
      document.getElementById('product-description').textContent = p.description;
      document.getElementById('product-material').textContent = p.material ? 'Material: ' + p.material : '';
      document.getElementById('product-stock').textContent = p.stock > 0 ? 'In Stock' : 'Out of Stock';
      document.getElementById('product-img-placeholder').textContent = p.category || 'Jewelry';
      if (p.stock === 0) document.getElementById('add-to-cart-btn').disabled = true;
      if (p.store_slug) {
        const badge = document.getElementById('product-location-badge');
        badge.textContent = p.store_slug === 'pdx' ? 'Portland Exclusive' : 'Seattle Exclusive';
        badge.className = 'product-location-badge badge-' + p.store_slug;
      }
      document.getElementById('product-loading').classList.add('hidden');
      document.getElementById('product-detail').classList.remove('hidden');
    }

    function showError() {
      document.getElementById('product-loading').classList.add('hidden');
      document.getElementById('product-error').classList.remove('hidden');
    }

    function changeQty(delta) {
      const inp = document.getElementById('quantity');
      inp.value = Math.min(10, Math.max(1, parseInt(inp.value) + delta));
    }

    async function addToCartFromPage() {
      if (!currentProduct) return;
      const qty = parseInt(document.getElementById('quantity').value);
      addToCart(currentProduct, qty);
      const fb = document.getElementById('add-to-cart-feedback');
      fb.textContent = qty + ' item(s) added to cart.';
      fb.className = 'feedback success';
      setTimeout(() => fb.className = 'feedback hidden', 3000);
    }
  </script>
</body>
</html>
